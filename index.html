<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
  /* 공통 색·글꼴 (다른 페이지도 같은 값을 쓴다) */
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --side-text: #f3e9dc;
    --accent: #c8783c;
    --text: #2d211a;
    --muted: #8a7a6d;
    --line: #e8dfd3;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
  }

  /* 왼쪽 메뉴 */
  nav {
    width: 220px;
    flex-shrink: 0;
    background: var(--side);
    color: var(--side-text);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  nav h1 { font-size: 18px; margin: 0 8px 20px; }
  nav button {
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    padding: 12px 14px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  nav button:hover { background: rgba(255, 255, 255, 0.1); }
  nav button.active { background: var(--accent); color: #fff; }

  /* 가운데 화면 */
  main { flex: 1; min-width: 0; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #home { padding: 32px; }
  #home h2 { margin: 0 0 8px; }
  #home p { color: var(--muted); margin: 0; }
  #soon { display: none; padding: 32px; color: var(--muted); font-size: 18px; }
  main.showing-frame iframe { display: block; }
  main.showing-frame #home,
  main.showing-soon #home { display: none; }
  main.showing-soon #soon { display: block; }

  /* 좁은 화면에서도 메뉴는 항상 왼쪽에 둔다 */
  @media (max-width: 640px) {
    nav { width: 120px; padding: 16px 8px; }
    nav h1 { font-size: 15px; margin: 0 6px 14px; }
    nav button { font-size: 14px; padding: 10px; }
  }
</style>
</head>
<body>
  <nav>
    <h1>☕ 골목카페</h1>
    <button class="active" data-page="home">홈</button>
    <button data-page="sales.html">매출</button>
    <button data-page="menu.html">메뉴</button>
    <button data-page="reviews.html">리뷰</button>
    <button data-page="promo.html">홍보</button>
  </nav>

  <main id="main">
    <section id="home">
      <h2>오늘의 가게</h2>
      <p>숫자 카드와 7일 매출 그래프가 여기에 들어옵니다. (3단계)</p>
    </section>
    <section id="soon">🚧 준비중입니다.</section>
    <iframe id="frame" title="내용 화면"></iframe>
  </main>

<script>
  var main = document.getElementById("main");
  var frame = document.getElementById("frame");
  var buttons = document.querySelectorAll("nav button");
  var token = 0;

  function show(mode) {
    main.classList.toggle("showing-frame", mode === "frame");
    main.classList.toggle("showing-soon", mode === "soon");
  }

  function go(page) {
    var mine = ++token;
    buttons.forEach(function (b) {
      b.classList.toggle("active", b.dataset.page === page);
    });
    if (page === "home") {
      show("home");
      return;
    }
    // 페이지 파일이 있으면 가운데에 열고, 없으면 "준비중"을 보여준다
    fetch(page, { method: "HEAD" })
      .then(function (r) {
        if (mine !== token) return;
        if (r.ok) { frame.src = page; show("frame"); }
        else show("soon");
      })
      .catch(function () { if (mine === token) show("soon"); });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { go(b.dataset.page); });
  });
</script>
</body>
</html>
