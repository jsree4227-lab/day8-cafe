<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
  /* 공통 색·글꼴 (다른 페이지도 같은 값을 쓴다) */
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --side-text: #f3e9dc;
    --accent: #c8783c;
    --text: #2d211a;
    --muted: #8a7a6d;
    --line: #e8dfd3;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
  }

  /* 왼쪽 메뉴 */
  nav {
    width: 220px;
    flex-shrink: 0;
    background: var(--side);
    color: var(--side-text);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  nav h1 { font-size: 18px; margin: 0 8px 20px; }
  nav button {
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    padding: 12px 14px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  nav button:hover { background: rgba(255, 255, 255, 0.1); }
  nav button.active { background: var(--accent); color: #fff; }

  /* 가운데 화면 */
  main { flex: 1; min-width: 0; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #home { padding: 32px; }
  #home { overflow-y: auto; height: 100%; }
  #home h2 { margin: 0 0 16px; }
  #home p { color: var(--muted); margin: 12px 0 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat b { font-size: 24px; }
  .stat small { font-size: 12px; color: var(--muted); }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .chart h3 { margin: 0 0 8px; font-size: 16px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { font-family: var(--font); fill: var(--muted); font-size: 12px; }
  .chart text.val { fill: var(--text); }
  #soon { display: none; padding: 32px; color: var(--muted); font-size: 18px; }
  main.showing-frame iframe { display: block; }
  main.showing-frame #home,
  main.showing-soon #home { display: none; }
  main.showing-soon #soon { display: block; }

  /* 좁은 화면에서도 메뉴는 항상 왼쪽에 둔다 */
  @media (max-width: 640px) {
    nav { width: 120px; padding: 16px 8px; }
    nav h1 { font-size: 15px; margin: 0 6px 14px; }
    nav button { font-size: 14px; padding: 10px; }
  }
</style>
</head>
<body>
  <nav>
    <h1>☕ 골목카페</h1>
    <button class="active" data-page="home">홈</button>
    <button data-page="sales.html">매출</button>
    <button data-page="menu.html">메뉴</button>
    <button data-page="reviews.html">리뷰</button>
    <button data-page="promo.html">홍보</button>
  </nav>

  <main id="main">
    <section id="home">
      <h2>오늘의 가게</h2>
      <div class="cards">
        <div class="stat"><span>오늘 매출</span><b id="sToday">-</b></div>
        <div class="stat"><span>오늘 판매 수량</span><b id="sQty">-</b></div>
        <div class="stat"><span>최근 7일 매출</span><b id="sWeek">-</b></div>
        <div class="stat"><span>재고 부족 메뉴</span><b id="sLow">-</b><small>10개 이하</small></div>
      </div>
      <div class="chart">
        <h3>최근 7일 매출</h3>
        <svg id="chart" viewBox="0 0 560 240" role="img" aria-label="최근 7일 매출 막대그래프"></svg>
      </div>
      <p id="homeMsg"></p>
    </section>
    <section id="soon">🚧 준비중입니다.</section>
    <iframe id="frame" title="내용 화면"></iframe>
  </main>

<script>
  var main = document.getElementById("main");
  var frame = document.getElementById("frame");
  var buttons = document.querySelectorAll("nav button");
  var token = 0;

  function show(mode) {
    main.classList.toggle("showing-frame", mode === "frame");
    main.classList.toggle("showing-soon", mode === "soon");
  }

  function go(page) {
    var mine = ++token;
    buttons.forEach(function (b) {
      b.classList.toggle("active", b.dataset.page === page);
    });
    if (page === "home") {
      show("home");
      loadHome();
      return;
    }
    // 페이지 파일이 있으면 가운데에 열고, 없으면 "준비중"을 보여준다
    fetch(page, { method: "HEAD" })
      .then(function (r) {
        if (mine !== token) return;
        if (r.ok) { frame.src = page; show("frame"); }
        else show("soon");
      })
      .catch(function () { if (mine === token) show("soon"); });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { go(b.dataset.page); });
  });

  /* ---- 홈: 숫자 카드 + 7일 매출 그래프 ---- */
  var SUPABASE_URL = "https://otkvzjcryqwecxurbipc.supabase.co";
  var SUPABASE_KEY = "sb_publishable_hL_cwznlEzYNytYwXRlKnA_PHxyGp3d";
  var LOW_STOCK = 10;
  var NS = "http://www.w3.org/2000/svg";

  function api(path) {
    return fetch(SUPABASE_URL + "/rest/v1/" + path, {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
      return r.json();
    });
  }

  function won(n) { return Number(n).toLocaleString("ko-KR") + "원"; }

  function dayKey(d) {
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function svgEl(name, attrs, text) {
    var el = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function drawChart(days) {
    var svg = document.getElementById("chart");
    svg.textContent = "";
    var W = 560, H = 240, padTop = 28, padBottom = 30, padX = 16;
    var max = Math.max.apply(null, days.map(function (d) { return d.total; }));
    var slot = (W - padX * 2) / days.length;
    var barW = slot * 0.55;
    var plotH = H - padTop - padBottom;
    svg.appendChild(svgEl("line", { x1: padX, x2: W - padX, y1: H - padBottom, y2: H - padBottom, stroke: "#e8dfd3" }));
    days.forEach(function (d, i) {
      var h = max > 0 ? Math.round((d.total / max) * plotH) : 0;
      var x = padX + slot * i + (slot - barW) / 2;
      var y = H - padBottom - h;
      svg.appendChild(svgEl("rect", {
        x: x, y: y, width: barW, height: h, rx: 4,
        fill: d.today ? "#c8783c" : "#e0b995"
      }));
      svg.appendChild(svgEl("text", { x: x + barW / 2, y: y - 6, "text-anchor": "middle", "class": "val" },
        d.total > 0 ? d.total.toLocaleString("ko-KR") : "0"));
      svg.appendChild(svgEl("text", { x: x + barW / 2, y: H - 10, "text-anchor": "middle" }, d.label));
    });
  }

  function loadHome() {
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var from = new Date(todayStart);
    from.setDate(from.getDate() - 6);

    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(from);
      d.setDate(from.getDate() + i);
      days.push({ key: dayKey(d), label: (d.getMonth() + 1) + "/" + d.getDate(), total: 0, qty: 0, today: i === 6 });
    }

    Promise.all([
      api("sales?select=qty,total,sold_at&sold_at=gte." + encodeURIComponent(from.toISOString()) + "&limit=10000"),
      api("menu_items?select=stock&stock=lte." + LOW_STOCK)
    ]).then(function (res) {
      var byKey = {};
      days.forEach(function (d) { byKey[d.key] = d; });
      res[0].forEach(function (s) {
        var d = byKey[dayKey(new Date(s.sold_at))];
        if (d) { d.total += s.total; d.qty += s.qty; }
      });
      var week = days.reduce(function (a, d) { return a + d.total; }, 0);
      var today = days[6];
      document.getElementById("sToday").textContent = won(today.total);
      document.getElementById("sQty").textContent = today.qty + "개";
      document.getElementById("sWeek").textContent = won(week);
      document.getElementById("sLow").textContent = res[1].length + "개";
      document.getElementById("homeMsg").textContent = "";
      drawChart(days);
    }).catch(function (err) {
      document.getElementById("homeMsg").textContent = "데이터를 불러오지 못했어요: " + err.message;
    });
  }

  loadHome();
</script>
</body>
</html>
