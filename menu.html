<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴·재고</title>
<style>
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --accent: #c8783c;
    --text: #2d211a;
    --muted: #8a7a6d;
    --line: #e8dfd3;
    --ok: #3f7d4e;
    --bad: #b3402f;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: var(--font); background: var(--bg); color: var(--text); }
  h2 { margin: 0 0 16px; }
  h3 { margin: 0 0 12px; font-size: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input { font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  input.name { width: 180px; }
  input.num { width: 100px; }
  button { font-family: inherit; font-size: 14px; padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  button:disabled { opacity: 0.5; cursor: default; }
  #msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
  #msg.ok { color: var(--ok); }
  #msg.bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: normal; }
  table { table-layout: fixed; }
  td input, td input.name, td input.num { width: 100%; min-width: 0; padding: 8px; }
  th:nth-child(1) { width: 34%; }
  th:nth-child(2) { width: 21%; }
  th:nth-child(3) { width: 21%; }
  td.actions { text-align: right; }
  td.actions button { margin: 2px 0 2px 4px; padding: 7px 10px; }
  td .badge { display: inline-block; margin: 4px 0 0; }
  .low { color: var(--bad); font-weight: bold; }
  .badge { font-size: 12px; background: #fbe9e5; color: var(--bad); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
  .empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
  <h2>메뉴·재고</h2>

  <section class="card">
    <h3>메뉴 추가</h3>
    <form id="addForm" class="row">
      <label>이름 <input id="newName" class="name" type="text" maxlength="40" required></label>
      <label>가격(원) <input id="newPrice" class="num" type="number" min="0" step="100" required></label>
      <label>재고(개) <input id="newStock" class="num" type="number" min="0" step="1" value="0" required></label>
      <button type="submit">추가</button>
    </form>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h3>메뉴 목록</h3>
    <table>
      <thead><tr><th>이름</th><th>가격(원)</th><th>재고(개)</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div id="empty" class="empty" hidden>등록된 메뉴가 없어요. 위에서 추가해 주세요.</div>
  </section>

<script>
  var SUPABASE_URL = "https://otkvzjcryqwecxurbipc.supabase.co";
  var SUPABASE_KEY = "sb_publishable_hL_cwznlEzYNytYwXRlKnA_PHxyGp3d";
  var LOW_STOCK = 10;

  var $ = function (id) { return document.getElementById(id); };

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, options.headers || {});
    return fetch(SUPABASE_URL + "/rest/v1/" + path, options).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error(t || r.status); });
      }
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function message(text, kind) {
    $("msg").textContent = text;
    $("msg").className = kind || "";
  }

  function fail(err) { message("처리하지 못했어요: " + err.message, "bad"); }

  function cell(child) {
    var td = document.createElement("td");
    td.appendChild(child);
    return td;
  }

  function input(type, value, cls, attrs) {
    var el = document.createElement("input");
    el.type = type;
    el.value = value;
    el.className = cls;
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function button(text, cls, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    if (cls) b.className = cls;
    b.addEventListener("click", onClick);
    return b;
  }

  function render(rows) {
    var body = $("list");
    body.textContent = "";
    rows.forEach(function (m) {
      var tr = document.createElement("tr");
      var name = input("text", m.name, "name", { maxlength: 40 });
      var price = input("number", m.price, "num", { min: 0, step: 100 });
      var stock = input("number", m.stock, "num", { min: 0, step: 1 });

      var stockTd = cell(stock);
      if (m.stock <= LOW_STOCK) {
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "재고 부족";
        stockTd.appendChild(badge);
      }

      var actions = document.createElement("td");
      actions.className = "actions";
      actions.appendChild(button("저장", "", function () { save(m.id, name, price, stock); }));
      actions.appendChild(button("삭제", "danger", function () { remove(m); }));

      tr.appendChild(cell(name));
      tr.appendChild(cell(price));
      tr.appendChild(stockTd);
      tr.appendChild(actions);
      body.appendChild(tr);
    });
    $("empty").hidden = rows.length > 0;
  }

  function load() {
    return api("menu_items?select=id,name,price,stock&order=id").then(render);
  }

  function readValues(name, price, stock) {
    var n = name.value.trim();
    var p = Number(price.value);
    var s = Number(stock.value);
    if (!n) throw new Error("이름을 입력해 주세요.");
    if (!Number.isInteger(p) || p < 0) throw new Error("가격은 0 이상의 정수로 입력해 주세요.");
    if (!Number.isInteger(s) || s < 0) throw new Error("재고는 0 이상의 정수로 입력해 주세요.");
    return { name: n, price: p, stock: s };
  }

  function save(id, name, price, stock) {
    var values;
    try { values = readValues(name, price, stock); } catch (e) { return fail(e); }
    message("저장 중...");
    api("menu_items?id=eq." + id, {
      method: "PATCH",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify(values)
    }).then(function () {
      message("'" + values.name + "' 저장했어요.", "ok");
      return load();
    }).catch(fail);
  }

  function remove(m) {
    if (!confirm("'" + m.name + "' 메뉴를 삭제할까요?\n지난 판매 기록은 그대로 남습니다.")) return;
    api("menu_items?id=eq." + m.id, {
      method: "DELETE",
      headers: { Prefer: "return=minimal" }
    }).then(function () {
      message("'" + m.name + "' 삭제했어요.", "ok");
      return load();
    }).catch(fail);
  }

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var values;
    try { values = readValues($("newName"), $("newPrice"), $("newStock")); } catch (err) { return fail(err); }
    message("추가 중...");
    api("menu_items", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify(values)
    }).then(function () {
      message("'" + values.name + "' 추가했어요.", "ok");
      $("addForm").reset();
      return load();
    }).catch(fail);
  });

  load().catch(function (err) {
    message("데이터를 불러오지 못했어요: " + err.message, "bad");
  });
</script>
</body>
</html>
